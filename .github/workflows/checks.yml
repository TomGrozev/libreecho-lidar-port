name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Keep in step with target-version in ruff.toml.
          python-version: '3.12'
      - run: pip install ruff==0.17.6
      - run: ruff check tools
      - run: python3 tools/check.py
