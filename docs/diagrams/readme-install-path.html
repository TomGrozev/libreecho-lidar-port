<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibreEcho install path · Steps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #ECEFF4;
      --color-ink:    #2E3440;
      --color-muted:  #434C5E;
      --color-accent: #8C2F3C;
      --font-sans:    system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif:   'Iowan Old Style', Georgia, serif;
      --font-mono:    ui-monospace, 'SFMono-Regular', Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: .66rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: .5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + .75rem, 2rem);
      font-weight: 400;
      letter-spacing: -.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Install path</p>
    <h1>How a stock unit becomes a LibreEcho unit</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="readme-install-path-title readme-install-path-desc">
        <title id="readme-install-path-title">LibreEcho install path</title>
        <desc id="readme-install-path-desc">A stock Fire OS unit becomes a LibreEcho unit through preparation, a custom boot chain, fastboot, and the installer, with A/B OTA updates after install.</desc>
        <rect width="100%" height="100%" fill="#ECEFF4"/>

        <g aria-hidden="true">
          <rect x="46" y="196" width="124" height="48" fill="rgba(46,52,64,0.05)" data-role="rail" data-step="stock" data-index="1"/>
          <rect x="170" y="196" width="124" height="48" fill="rgba(46,52,64,0.09)" data-role="rail" data-step="prepare" data-index="2"/>
          <rect x="294" y="196" width="124" height="48" fill="rgba(140,47,60,0.08)" data-role="rail" data-step="chain" data-index="3" data-focal="true"/>
          <line x1="294" y1="196" x2="418" y2="196" stroke="#8C2F3C" stroke-width="1"/>
          <line x1="294" y1="244" x2="418" y2="244" stroke="#8C2F3C" stroke-width="1"/>
          <rect x="418" y="196" width="124" height="48" fill="rgba(46,52,64,0.09)" data-role="rail" data-step="fastboot" data-index="4"/>
          <rect x="542" y="196" width="124" height="48" fill="rgba(46,52,64,0.05)" data-role="rail" data-step="install" data-index="5"/>
          <rect x="666" y="196" width="124" height="48" fill="rgba(46,52,64,0.09)" data-role="rail" data-step="running" data-index="6"/>
          <rect x="790" y="196" width="124" height="48" fill="rgba(46,52,64,0.05)" data-role="rail" data-step="ota" data-index="7"/>
        </g>

        <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.14em" text-anchor="middle">
          <text x="108" y="137" fill="#434C5E" data-role="number" data-step="stock">01</text><line x1="108" y1="153" x2="108" y2="181" stroke="#C2C8D4"/>
          <text x="232" y="137" fill="#434C5E" data-role="number" data-step="prepare">02</text><line x1="232" y1="153" x2="232" y2="181" stroke="#C2C8D4"/>
          <text x="356" y="137" fill="#8C2F3C" data-role="number" data-step="chain">03</text><line x1="356" y1="153" x2="356" y2="181" stroke="#8C2F3C"/>
          <text x="480" y="137" fill="#434C5E" data-role="number" data-step="fastboot">04</text><line x1="480" y1="153" x2="480" y2="181" stroke="#C2C8D4"/>
          <text x="604" y="137" fill="#434C5E" data-role="number" data-step="install">05</text><line x1="604" y1="153" x2="604" y2="181" stroke="#C2C8D4"/>
          <text x="728" y="137" fill="#434C5E" data-role="number" data-step="running">06</text><line x1="728" y1="153" x2="728" y2="181" stroke="#C2C8D4"/>
          <text x="852" y="137" fill="#434C5E" data-role="number" data-step="ota">07</text><line x1="852" y1="153" x2="852" y2="181" stroke="#C2C8D4"/>
        </g>

        <g aria-hidden="true" fill="#ECEFF4" stroke-width="1">
          <circle cx="108" cy="220" r="30" stroke="none"/>
          <circle cx="108" cy="220" r="30" stroke="#2E3440" data-role="medallion" data-step="stock"/>
          <circle cx="232" cy="220" r="30" stroke="none"/>
          <circle cx="232" cy="220" r="30" stroke="#2E3440" data-role="medallion" data-step="prepare"/>
          <circle cx="356" cy="220" r="30" fill="#ECEFF4" stroke="none"/>
          <circle cx="356" cy="220" r="30" fill="rgba(140,47,60,0.08)" stroke="#8C2F3C" data-role="medallion" data-step="chain" data-focal="true"/>
          <circle cx="480" cy="220" r="30" stroke="none"/>
          <circle cx="480" cy="220" r="30" stroke="#2E3440" data-role="medallion" data-step="fastboot"/>
          <circle cx="604" cy="220" r="30" stroke="none"/>
          <circle cx="604" cy="220" r="30" stroke="#2E3440" data-role="medallion" data-step="install"/>
          <circle cx="728" cy="220" r="30" stroke="none"/>
          <circle cx="728" cy="220" r="30" stroke="#2E3440" data-role="medallion" data-step="running"/>
          <circle cx="852" cy="220" r="30" stroke="none"/>
          <circle cx="852" cy="220" r="30" stroke="#2E3440" data-role="medallion" data-step="ota"/>
        </g>

        <g aria-hidden="true" fill="none" stroke="#2E3440" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <g transform="translate(96 208)"><path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14"/><path d="M11 4h2"/><path d="M12 17v.01"/></g>
          <g transform="translate(220 208)"><path d="M5 7l5 5l-5 5"/><path d="M12 19l7 0"/></g>
          <g transform="translate(344 208)" stroke="#8C2F3C"><path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0"/><path d="M15 9h.01"/></g>
          <g transform="translate(468 208)"><path d="M5 12l14 0"/><path d="M13 18l6 -6"/><path d="M13 6l6 6"/></g>
          <g transform="translate(592 208)"><path d="M4 13a8 8 0 0 1 7 7a6 6 0 0 0 3 -5a9 9 0 0 0 6 -8a3 3 0 0 0 -3 -3a9 9 0 0 0 -8 6a6 6 0 0 0 -5 3"/><path d="M7 14a6 6 0 0 0 -3 6a6 6 0 0 0 6 -3"/><path d="M14 9a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/></g>
          <g transform="translate(716 208)"><path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14"/><path d="M11 4h2"/><path d="M12 17v.01"/></g>
          <g transform="translate(840 208)"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></g>
        </g>

        <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
          <text x="108" y="300" fill="#2E3440" font-size="12" font-weight="600">Stock Fire OS</text>
          <text x="232" y="300" fill="#2E3440" font-size="12" font-weight="600">lidar_prepare.py</text>
          <text x="356" y="300" fill="#8C2F3C" font-size="12" font-weight="600">Custom</text>
          <text x="356" y="316" fill="#8C2F3C" font-size="12" font-weight="600">boot chain</text>
          <text x="480" y="300" fill="#2E3440" font-size="12" font-weight="600">Fastboot</text>
          <text x="604" y="300" fill="#2E3440" font-size="12" font-weight="600">LibreEcho</text>
          <text x="604" y="316" fill="#2E3440" font-size="12" font-weight="600">installer</text>
          <text x="728" y="300" fill="#2E3440" font-size="12" font-weight="600">LibreEcho</text>
          <text x="728" y="316" fill="#2E3440" font-size="12" font-weight="600">running</text>
          <text x="852" y="300" fill="#2E3440" font-size="12" font-weight="600">A/B OTA update</text>
        </g>

        <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" text-anchor="middle" fill="#434C5E">
          <text x="108" y="340">hold Action + power</text>
          <text x="108" y="358">for BROM mode</text>
          <text x="232" y="340">backup, restore</text>
          <text x="232" y="358">drill, chain install</text>
          <text x="356" y="340">signed preloader,</text>
          <text x="356" y="358">Kaeru LK + Koboreru</text>
          <text x="480" y="340">bootloader mode</text>
          <text x="604" y="340">--target lidar</text>
          <text x="728" y="340">updates arrive as</text>
          <text x="728" y="358">A/B OTA</text>
          <text x="852" y="340">inactive slot,</text>
          <text x="852" y="358">health + fallback</text>
        </g>

        <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(46,52,64,0.10)" stroke-width="0.8"/>
        <text x="40" y="520" fill="#434C5E" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.18em">LEGEND</text>
        <circle cx="52" cy="532" r="8" fill="#ECEFF4" stroke="#2E3440"/>
        <text x="68" y="536" fill="#434C5E" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Stage</text>
        <circle cx="148" cy="532" r="8" fill="rgba(140,47,60,0.08)" stroke="#8C2F3C"/>
        <text x="164" y="536" fill="#434C5E" font-size="8.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Focal stage</text>
      </svg>
    </div>
  </div>
</body>
</html>
