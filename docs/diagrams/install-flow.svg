  <text x="682" y="117" fill="#2e3440" fill-opacity="0.8" font-size="7" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
  <text x="744" y="138" fill="#2E3440" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Read boot_a</text>
