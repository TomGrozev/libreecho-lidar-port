  <text x="344" y="270" fill="#434C5E" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" text-anchor="middle">first write</text>
  <rect x="64" y="212" width="160" height="80" rx="6" fill="#ECEFF4"/>
