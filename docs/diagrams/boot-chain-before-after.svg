<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" data-diagram="architecture-delta" role="img" aria-labelledby="boot-chain-before-after-title boot-chain-before-after-desc" id="boot-chain-before-after-root">
        <title id="boot-chain-before-after-title">Boot chain before and after lidar_prepare.py install</title>
        <desc id="boot-chain-before-after-desc">Two snapshots of the Lidar boot chain: the stock chain, and the chain after install where the preloader becomes the signed 2019 image, tee1 becomes Koboreru plus the stock tail, and the stock LK becomes the Kaeru LK stage in expdb; BROM and the stock boot_a / boot_b are unchanged.</desc>
        <defs>
      <style>#boot-chain-before-after-root { --color-paper: #ECEFF4;
      --color-ink: #2E3440;
      --color-muted: #434C5E;
      --color-soft: #55637D;
      --color-rule: rgba(46,52,64,0.12);
      --color-accent: #8C2F3C;
      --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Iowan Old Style', Georgia, serif;
      --font-mono: ui-monospace, 'SFMono-Regular', Menlo, monospace; }
      #boot-chain-before-after-root { font-family: var(--font-sans); color: var(--color-ink); }
      #boot-chain-before-after-root .subtitle { max-width: 68ch; font-size: 0.9375rem; line-height: 1.6; color: var(--color-muted); margin-bottom: 1.75rem; }
      #boot-chain-before-after-root .diagram-container { width: 100%; overflow-x: auto; }
      #boot-chain-before-after-root .diagram-container:focus-visible { outline: 2px solid var(--color-muted); outline-offset: 4px; }
      #boot-chain-before-after-root .scroll-hint { display: none; margin: 1rem 0 0; font-size: 0.8125rem; color: var(--color-muted); }
      @media (max-width: 700px) {
#boot-chain-before-after-root .scroll-hint { display: block; }
}
      @media print {
#boot-chain-before-after-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="boot-chain-before-after-boot-chain-before-after-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 8 3, 0 6" fill="#434C5E"/>
          </marker>
        </defs>
        <rect width="960" height="600" fill="#ECEFF4"/>

        <text x="40" y="52" fill="#2E3440" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600">Before</text>
        <text x="40" y="72" fill="#55637D" font-size="10" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">stock chain</text>
        <text x="352" y="52" fill="#2E3440" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600">Changes</text>
        <text x="352" y="72" fill="#8C2F3C" font-size="10" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">lidar_prepare.py install</text>
        <text x="632" y="52" fill="#2E3440" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600">After</text>
        <text x="632" y="72" fill="#55637D" font-size="10" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">install applied · BOOT1 never written</text>

        <path d="M 340 40 V 528 M 620 40 V 528" fill="none" stroke="#2e3440" stroke-width="1" stroke-opacity="0.12"/>

