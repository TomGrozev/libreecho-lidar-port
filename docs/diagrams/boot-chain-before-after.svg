          <path data-kind="relationship" data-object-id="r2" data-status="unchanged" data-signature="handoff:preloader-to-tee1" data-from="preloader" data-to="tee1" d="M 144 164 V 184" fill="none" stroke="#434C5E" stroke-width="1.2" marker-end="url(#boot-chain-before-after-boot-chain-before-after-arrow)"/>
