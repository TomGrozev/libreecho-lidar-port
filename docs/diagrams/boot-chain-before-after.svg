        <text x="352" y="104" fill="#55637D" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">01</text>
        <text x="384" y="102" data-change="CHANGED" data-target="preloader" fill="#434C5E" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">CHANGED preloader<tspan x="384" y="124" fill="#2E3440" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" letter-spacing="0">BOOT0 area 1</tspan><tspan x="384" y="140" fill="#2E3440" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" letter-spacing="0">2023 stock → signed 2019</tspan></text>
